<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leads — Painel de Scraping</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>

    <header class="topbar">
      <div>
        <p class="eyebrow">Lead Operations</p>
        <h1>Banco de Leads</h1>
      </div>
      <div class="topbar-nav">
        <nav class="nav-links" aria-label="Navegação do painel">
          <a href="/panel/">Scraping</a>
          <a href="/panel/leads" class="active">Leads</a>
          <a href="/panel/engagement">Engajamento</a>
          <a href="/panel/whatsapp">WhatsApp</a>
          <a href="/panel/email">Email</a>
          <a href="/panel/contacts">Contatos</a>
          <a href="/panel/prospeccao">Prospecção</a>
          <a href="/panel/ops">Operações</a>
        </nav>
        <div class="health" id="healthBadge">API: verificando...</div>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="panel-head">
          <h3>Todos os Leads</h3>
          <div class="row-gap" style="align-items: flex-end;">
            <label>
              Campo Atuação
              <select id="leadsSegmentFilter">
                <option value="">Todos os Segmentos</option>
              </select>
            </label>
            <button id="btnNewSegment" type="button" class="ghost" style="margin-bottom: 2px;">+ Novo Segmento</button>
            <label>
              Fonte
              <select id="leadsSourceFilter"></select>
            </label>
            <label>
              Gênero
              <select id="leadsGenderFilter">
                <option value="">Todos os generos</option>
                <option value="F">Feminino</option>
                <option value="M">Masculino</option>
              </select>
            </label>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Score</th>
                <th>Temp.</th>
                <th>Funil</th>
                <th>Genero</th>
                <th>Fonte</th>
                <th>Criado em</th>
              </tr>
            </thead>
            <tbody id="leadsBody"></tbody>
          </table>
        </div>

        <div class="row-gap" style="justify-content: flex-end; margin-top: 16px;">
          <label style="flex-direction: row; align-items: center; gap: 8px;">
            Por pagina
            <select id="leadsPageSize" style="width: auto; padding: 8px;">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="30">30</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
          <button id="prevLeads" type="button" class="ghost">Anterior</button>
          <span id="leadsPageLabel" class="page-label">Página 1</span>
          <button id="nextLeads" type="button" class="ghost">Próxima</button>
          <button id="refreshLeads" type="button" class="ghost">Atualizar</button>
        </div>
      </section>
    </main>

    <div id="segmentModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px);">
      <div class="modal-content" style="background: var(--card-outer, #ffffff); padding: 2rem; border-radius: 8px; width: 400px; max-width: 90%; border: 1px solid var(--border, #e2e8f0); box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
        <h3 style="margin-top: 0;">Novo Segmento</h3>
        <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 1.5rem;">Cria as fontes de busca do Google Maps e da Web automaticamente.</p>
        
        <label style="display: block; margin-bottom: 1rem;">
          Nome do Segmento (ex: psicologia)
          <input type="text" id="segmentNameInput" style="width: 100%; margin-top: 0.25rem;" placeholder="Nome curto, sem espaços">
        </label>
        
        <label style="display: block; margin-bottom: 1.5rem;">
          Termo de Busca (ex: clínicas de psicologia)
          <input type="text" id="segmentTermInput" style="width: 100%; margin-top: 0.25rem;" placeholder="O que o robô vai buscar?">
        </label>
        
        <div style="display: flex; gap: 1rem; justify-content: flex-end;">
          <button type="button" id="btnCancelSegment" class="ghost">Cancelar</button>
          <button type="button" id="btnSaveSegment">Salvar Segmento</button>
        </div>
        <p id="segmentStatus" style="font-size: 14px; margin-top: 1rem;"></p>
      </div>
    </div>

    <script src="./leads.js"></script>
  </body>
</html>
